apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - ../../configs/dev
configMapGenerator:
  - name: bot-config
    files:
      - config.yaml=bot_config.yaml
images:
  - name: ghcr.io/shirovpn/main_api_worker
    newTag: "0.1.0-dev"
  - name: ghcr.io/shirovpn/botv2
    newTag: "0.2.2-dev"
  - name: ghcr.io/shirovpn/peerhub_wireguard_worker
    newTag: "0.0.11"
  - name: ghcr.io/shirovpn/peerhub_heartbeat
    newTag: "v0.2.0"
patches:
  - target:
      kind: Deployment
      name: bot
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: bot
      spec:
        template:
          spec:
            containers:
              - name: bot
                env:
                  - name: BACKEND_URL
                    $patch: delete
                  - name: TASK_TIMEOUT
                    $patch: delete
                  - name: BROKER_RESULT_BACKEND_URL
                    valueFrom:
                      secretKeyRef:
                        name: shiro-secret
                        key: BACKEND_URL
                volumeMounts:
                  - name: bot-config
                    mountPath: /config
            volumes:
              - name: bot-config
                configMap:
                  name: bot-config
