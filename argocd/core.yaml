apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: core
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ShiroVPN/k8s_new.git
    targetRevision: dev
    path: overlays/core
  destination:
    server: https://kubernetes.default.svc
    namespace: shiro
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
