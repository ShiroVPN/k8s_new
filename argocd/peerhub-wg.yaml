apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: peerhub-wg
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ShiroVPN/k8s_new.git
    targetRevision: main
    path: overlays/peerhub-wg
    kustomize:
      buildOptions: "--enable-alpha-plugins --enable-exec"
  destination:
    server: https://kubernetes.default.svc
    namespace: shiro-peerhub-wg
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
