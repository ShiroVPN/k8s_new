apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: peerhub-wg
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ShiroVPN/k8s_new.git
    targetRevision: dev
    path: overlays/peerhub-wg
  destination:
    server: https://kubernetes.default.svc
    namespace: shiro-peerhub-wg
  syncPolicy:
    # dev only: a push should land without clicking Sync.
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
