name: tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-kubectl@v4

      - name: Build bases
        run: |
          for dir in manifests/core manifests/node manifests/observability \
            manifests/tests; do
            kubectl kustomize "$dir" >/dev/null
            echo "ok $dir"
          done

  # The suites talk to a deployed stack, so there is nothing to spin up here:
  # point the job at the test cluster with KUBECONFIG_B64 (a base64 kubeconfig
  # with access to the `shiro` and `shiro-peerhub-wg` namespaces). Without the
  # secret the job only validates the manifests.
  cluster:
    needs: manifests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-kubectl@v4

      - name: Подключиться к тестовому кластеру
        id: kube
        run: |
          if [ -z "$KUBECONFIG_B64" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "KUBECONFIG_B64 не задан — тесты в кластере пропущены" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p ~/.kube
          printf '%s' "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl version --request-timeout=10s
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Тесты
        if: steps.kube.outputs.ready == 'true'
        run: ./scripts/run-tests.sh

      - name: Логи при падении
        if: failure()
        continue-on-error: true
        run: |
          kubectl -n shiro get pods -l app=shiro-tests
          kubectl -n shiro logs -l app=shiro-tests --tail=200 || true
          kubectl -n shiro-peerhub-wg logs -l app=shiro-tests --tail=200 || true
