apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Written by dev.sh: tags are images built on the cluster machine and imported
# into k3s containerd, so they are never present in a registry.
images:
  - name: ghcr.io/shirovpn/main_api_worker
    newTag: dev-20261114-225930
  - name: ghcr.io/shirovpn/botv2
    newTag: dev-20261114-225930
  - name: ghcr.io/shirovpn/peerhub_wireguard_worker
    newTag: dev-20261114-225930

patches:
  - target:
      kind: Deployment
      name: main-api-worker|main-api-scheduler|main-api-webhook|bot|peerhub-wireguard-worker
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target:
      kind: Deployment
      name: main-api-worker
    patch: |-
      - op: add
        path: /spec/template/spec/initContainers/0/imagePullPolicy
        value: Never
  # The laptop reaches the mini app through the host network, prod does not.
  - target:
      kind: Deployment
      name: bot
    patch: |-
      - op: add
        path: /spec/template/spec/hostNetwork
        value: true
      - op: add
        path: /spec/template/spec/dnsPolicy
        value: ClusterFirstWithHostNet
