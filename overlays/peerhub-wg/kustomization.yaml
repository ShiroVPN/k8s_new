apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shiro-peerhub-wg

resources:
  - ../../manifests/node

components:
  - ../dev/component

generators:
  - ksops.yaml

patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          shiro.io/peerhub-wg: "true"
