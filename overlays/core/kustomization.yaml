apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shiro

resources:
  - ../../manifests/core

generators:
  - ksops.yaml

patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          shiro.io/core: "true"
  - target:
      kind: Deployment
      name: caddy
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
