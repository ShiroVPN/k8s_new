apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot
  labels:
    app: bot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bot
  template:
    metadata:
      labels:
        app: bot
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: bot
          image: ghcr.io/shirovpn/botv2:0.1.21
          ports:
            - containerPort: 18088
          env:
            - name: BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: shiro-secret
                  key: BROKER_URL
            - name: BACKEND_URL
              valueFrom:
                secretKeyRef:
                  name: shiro-secret
                  key: BACKEND_URL
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: shiro-secret
                  key: TELEGRAM_BOT_TOKEN
            - name: API_STUB
              value: "0"
            - name: TASK_TIMEOUT
              value: "30"
            - name: STUB_PAYMENT
              valueFrom:
                configMapKeyRef:
                  name: core-config
                  key: STUB_PAYMENT
            - name: ADMIN_TELEGRAM_IDS
              valueFrom:
                configMapKeyRef:
                  name: core-config
                  key: ADMIN_TELEGRAM_IDS
            - name: WEBAPP_PORT
              value: "18088"
            - name: MINI_APP_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: core-config
                  key: MINI_APP_DOMAIN
            - name: MINI_APP_URL
              value: https://$(MINI_APP_DOMAIN)
          readinessProbe:
            tcpSocket:
              port: 18088
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
