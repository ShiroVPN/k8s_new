apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-config
data:
  Caddyfile: |
    {$WEBHOOK_DOMAIN} {
            @platega {
                    method POST
                    path /platega/callback
                    remote_ip 116.202.184.149
            }
            handle @platega {
                    reverse_proxy main-api-webhook:8080
            }
            handle {
                    respond 404
            }
    }

    {$MINI_APP_DOMAIN} {
            reverse_proxy bot:8080
    }

    # Cluster dashboards under one name. Caddy runs inside the pod network, so
    # Service DNS resolves and no kubectl port-forward is needed.
    # Panels that have their own login, one hostname each. Sub-paths would need
    # per-app prefix configuration and break port-forward; separate hostnames
    # keep the manifests identical to upstream defaults.
    # Only panels with authentication live here: prometheus, jaeger and
    # elasticsearch have none of their own and stay behind port-forward.
    {$ADMIN_DOMAIN} {
            # The name does not resolve yet, so ACME would fail on every
            # attempt. Caddy signs with its own CA until a real A record exists.
            tls internal
            redir https://grafana.{$ADMIN_DOMAIN}{uri} 302
    }

    grafana.{$ADMIN_DOMAIN} {
            tls internal
            reverse_proxy grafana.observability.svc.cluster.local:3000
    }

    rabbitmq.{$ADMIN_DOMAIN} {
            tls internal
            reverse_proxy rabbitmq.shiro.svc.cluster.local:15672
    }

    wg-easy.{$ADMIN_DOMAIN} {
            tls internal
            reverse_proxy wg-easy.shiro-peerhub-wg.svc.cluster.local:51821
    }
