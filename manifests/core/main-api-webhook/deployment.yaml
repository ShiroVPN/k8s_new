apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-api-webhook
  labels:
    app: main-api-webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: main-api-webhook
  template:
    metadata:
      labels:
        app: main-api-webhook
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: main-api-webhook
          image: ghcr.io/shirovpn/main_api_worker:0.0.19
          command:
            - /venv/bin/python
            - -m
            - main_api_worker.webhook
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shiro-secret
                  key: DATABASE_URL
            - name: BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: shiro-secret
                  key: BROKER_URL
            - name: BACKEND_URL
              valueFrom:
                secretKeyRef:
                  name: shiro-secret
                  key: BACKEND_URL
            - name: CONFIG_PATH
              value: /config/config.yml
            - name: PEERHUB_WORKER_WAIT_RESULT_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: core-config
                  key: PEERHUB_WORKER_WAIT_RESULT_TIMEOUT
            - name: PEERHUB_LAST_SEEN_LIMIT_IN_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: core-config
                  key: PEERHUB_LAST_SEEN_LIMIT_IN_SECONDS
            - name: PLATEGA_MERCHANT_ID
              valueFrom:
                secretKeyRef:
                  name: shiro-secret
                  key: PLATEGA_MERCHANT_ID
            - name: PLATEGA_SECRET
              valueFrom:
                secretKeyRef:
                  name: shiro-secret
                  key: PLATEGA_SECRET
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: main-api-config
            items:
              - key: config.yml
                path: config.yml
