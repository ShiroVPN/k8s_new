apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  labels:
    app: pgadmin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pgadmin
  template:
    metadata:
      labels:
        app: pgadmin
    spec:
      containers:
        - name: pgadmin
          image: dpage/pgadmin4:9.19.0
          ports:
            - containerPort: 80
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              value: admin@example.com
            - name: PGADMIN_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shiro-secret
                  key: PGADMIN_PASSWORD
            - name: PGADMIN_REPLACE_SERVERS_ON_STARTUP
              value: "True"
            - name: PGPASS_FILE
              value: /pgpass/pgpass
          volumeMounts:
            - name: servers
              mountPath: /pgadmin4/servers.json
              subPath: servers.json
            - name: pgpass
              mountPath: /pgpass
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
      volumes:
        - name: servers
          configMap:
            name: pgadmin-servers
        - name: pgpass
          secret:
            secretName: shiro-secret
            defaultMode: 0600
            items:
              - key: PGADMIN_PGPASS
                path: pgpass
