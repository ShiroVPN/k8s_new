apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudbeaver
  labels:
    app: cloudbeaver
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cloudbeaver
  template:
    metadata:
      labels:
        app: cloudbeaver
    spec:
      initContainers:
        - name: data-sources
          image: dbeaver/cloudbeaver:26.2.4
          command:
            - sh
            - -c
            - |
              target=/opt/cloudbeaver/workspace/GlobalConfiguration/.dbeaver/data-sources.json
              if [ -f "$target" ]; then
                exit 0
              fi
              mkdir -p "${target%/*}"
              escaped=$(printf '%s' "$POSTGRES_PASSWORD" | sed -e 's/[\\|&]/\\&/g')
              sed -e "s|__POSTGRES_PASSWORD__|$escaped|g" /config/data-sources.json > "$target"
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shiro-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /opt/cloudbeaver/workspace
            - name: sources
              mountPath: /config
      containers:
        - name: cloudbeaver
          image: dbeaver/cloudbeaver:26.2.4
          ports:
            - containerPort: 8978
          env:
            - name: CB_ADMIN_NAME
              value: admin
            - name: CB_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shiro-secret
                  key: CB_ADMIN_PASSWORD
            - name: CB_SERVER_NAME
              value: shiro
            - name: CLOUDBEAVER_DB_INITIAL_DATA
              value: /initial-data/initial-data.conf
          volumeMounts:
            - name: data
              mountPath: /opt/cloudbeaver/workspace
            - name: initial
              mountPath: /initial-data
          readinessProbe:
            tcpSocket:
              port: 8978
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cloudbeaver-data
        - name: sources
          configMap:
            name: cloudbeaver-data-sources
        - name: initial
          configMap:
            name: cloudbeaver-initial-data
