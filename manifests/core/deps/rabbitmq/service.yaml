apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    app: rabbitmq
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    # management UI; used by ./deploy.sh forward and by Caddy
    - name: management
      port: 15672
      targetPort: 15672
