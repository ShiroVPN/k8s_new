apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - config/core.yaml
  - config/main-api.yaml
  - config/caddy.yaml
  # deps: open-source services we only run
  - deps/postgres/pvc.yaml
  - deps/postgres/deployment.yaml
  - deps/postgres/service.yaml
  - deps/rabbitmq/pvc.yaml
  - deps/rabbitmq/deployment.yaml
  - deps/rabbitmq/service.yaml
  - deps/redis/deployment.yaml
  - deps/redis/service.yaml
  # aux: panels and proxies around the stack
  - aux/caddy/pvc.yaml
  - aux/caddy/deployment.yaml
  - aux/cloudbeaver/pvc.yaml
  - aux/cloudbeaver/deployment.yaml
  - aux/cloudbeaver/service.yaml
  # apps: our own code
  - apps/main-api-worker/deployment.yaml
  - apps/main-api-scheduler/deployment.yaml
  - apps/main-api-webhook/deployment.yaml
  - apps/main-api-webhook/service.yaml
  - apps/bot/deployment.yaml
  - apps/bot/service.yaml
