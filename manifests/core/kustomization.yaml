apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../configs
  - postgres/pvc.yaml
  - postgres/deployment.yaml
  - postgres/service.yaml
  - rabbitmq/pvc.yaml
  - rabbitmq/deployment.yaml
  - rabbitmq/service.yaml
  - redis/deployment.yaml
  - redis/service.yaml
  # panels: panels and proxies around the stack
  - panels/dbgate/deployment.yaml
  - panels/dbgate/service.yaml
  - panels/pgadmin/servers.yaml
  - panels/pgadmin/deployment.yaml
  - panels/pgadmin/service.yaml
  # apps: our own code
  - main_api/worker/deployment.yaml
  - main_api/scheduler/deployment.yaml
  - main_api/webhook/deployment.yaml
  - main_api/webhook/service.yaml
