apiVersion: apps/v1
kind: Deployment
metadata:
  name: xui-db
  labels:
    app: xui-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: xui-db
  template:
    metadata:
      labels:
        app: xui-db
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: xui-db
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: xui
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: node-secret
                  key: XUI_DB_PASSWORD
            - name: POSTGRES_DB
              value: xui
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "xui", "-d", "xui"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: xui-db-data
