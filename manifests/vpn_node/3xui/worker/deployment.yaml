apiVersion: apps/v1
kind: Deployment
metadata:
  name: peerhub-3xui-worker
  labels:
    app: peerhub-3xui-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: peerhub-3xui-worker
  template:
    metadata:
      labels:
        app: peerhub-3xui-worker
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: peerhub-3xui-worker
          image: ghcr.io/shirovpn/peerhub_3xui_worker:unset
          command:
            - /venv/bin/taskiq
            - worker
            - apps.worker:broker

          env:
            - name: BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: node-secret
                  key: BROKER_URL
            - name: BROKER_RESULT_BACKEND_URL
              valueFrom:
                secretKeyRef:
                  name: node-secret
                  key: BACKEND_URL
            - name: PEERHUB_ID
              valueFrom:
                configMapKeyRef:
                  name: vpn-node-config
                  key: XUI_PEERHUB_ID
            - name: COUNTRY
              valueFrom:
                configMapKeyRef:
                  name: vpn-node-config
                  key: COUNTRY
            - name: SERVER_NAME
              valueFrom:
                configMapKeyRef:
                  name: vpn-node-config
                  key: SERVER_NAME
            - name: CONNECTION_TYPE
              value: xui
            - name: HEARTBEAT_INTERVAL_IN_SECONDS
              value: "60"
            - name: XUI_PANEL_BASE_PATH
              valueFrom:
                secretKeyRef:
                  name: node-secret
                  key: XUI_PANEL_BASE_PATH
            - name: XUI_URL
              value: "http://xui:2053/$(XUI_PANEL_BASE_PATH)"
            - name: XUI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: node-secret
                  key: XUI_TOKEN
            - name: SERVER_HOST
              valueFrom:
                configMapKeyRef:
                  name: vpn-node-config
                  key: SERVER_HOST
            - name: XUI_SUBSCRIPTION_BASE_PATH
              valueFrom:
                secretKeyRef:
                  name: node-secret
                  key: XUI_SUBSCRIPTION_BASE_PATH
            - name: XUI_SUBSCRIPTION_BASE_URL
              value: "https://$(SERVER_HOST)/$(XUI_SUBSCRIPTION_BASE_PATH)"
            - name: XUI_INBOUND_IDS
              valueFrom:
                configMapKeyRef:
                  name: vpn-node-config
                  key: XUI_INBOUND_IDS
            - name: XUI_VERIFY
              valueFrom:
                configMapKeyRef:
                  name: vpn-node-config
                  key: XUI_VERIFY
            - name: OTEL_COLLECTOR_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4317
            - name: OTEL_SERVICE_NAME
              value: peerhub_3xui_worker

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
