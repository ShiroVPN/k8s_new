apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot-notify-worker
  labels:
    app: bot-notify-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bot-notify-worker
  template:
    metadata:
      labels:
        app: bot-notify-worker
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: bot-notify-worker
          image: ghcr.io/shirovpn/botv2:unset
          command:
            - /venv/bin/taskiq
            - worker
            - apps.notify_worker.broker:broker
          env:
            - name: BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: shiro-secret
                  key: BROKER_URL
            - name: BROKER_RESULT_BACKEND_URL
              valueFrom:
                secretKeyRef:
                  name: shiro-secret
                  key: BACKEND_URL
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: env-secret
                  key: TELEGRAM_BOT_TOKEN
            - name: API_STUB
              value: "0"
            - name: MINI_APP_URL
              value: https://$(MINI_APP_DOMAIN)
          volumeMounts:
            - name: bot-config
              mountPath: /config
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
      volumes:
        - name: bot-config
          configMap:
            name: bot-config
