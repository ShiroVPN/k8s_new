apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  datasources.yaml: |
    apiVersion: 1

    # Names match the dashboards below, do not rename without editing them.
    datasources:
      - name: Prometheus-OTEL
        type: prometheus
        url: http://prometheus:9090
        editable: true

      - name: Jaeger-OTEL
        type: jaeger
        # Jaeger serves its API under QUERY_BASE_PATH, hence the prefix.
        url: http://jaeger:16686/jaeger
        editable: true

      - name: Elasticsearch-OTEL
        type: elasticsearch
        url: http://elasticsearch:9200
        editable: true
        jsonData:
          index: "*"
          timeField: "@timestamp"
