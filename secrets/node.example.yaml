apiVersion: v1
kind: Secret
metadata:
  name: node-secret
type: Opaque
stringData:
  BROKER_URL: amqp://core:<RABBITMQ_PASSWORD>@rabbitmq.shiro.svc.cluster.local:5672/
  BACKEND_URL: redis://:<REDIS_PASSWORD>@redis.shiro.svc.cluster.local:6379/0
  WG_EASY_PASSWORD: ""
  XUI_DB_PASSWORD: "<db-password>"
  XUI_DB_DSN: "postgres://xui:<XUI_DB_PASSWORD>@xui-db:5432/xui?sslmode=disable"
  XUI_ADMIN_USERNAME: "<panel-username>"
  XUI_ADMIN_PASSWORD: "<panel-password>"
  XUI_TOKEN: "<48-character-token>"
  XUI_REALITY_PRIVATE_KEY: "<xray-x25519-private>"
  XUI_REALITY_PUBLIC_KEY: "<xray-x25519-public>"
  XUI_REALITY_SHORT_IDS: "<hex>,<hex>,<hex>"
  XUI_AWG_PRIVATE_KEY: "<wg-genkey>"
  XUI_AWG_PUBLIC_KEY: "<wg-pubkey>"
  XUI_AWG_HEADER_PROTECTION_KEY: "<openssl-rand-base64-32>"
