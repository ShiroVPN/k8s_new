main_api_wait_result_timeout: 30

images_path: assets

topup:
  min_amount: 10
  max_amount: 100000
  presets: [100, 300, 500, 1000]

webapp:
  host: 0.0.0.0
  auth_max_age_in_seconds: 86400

subscription:
  expiring_soon_days: 3
  default_limit_peers: 1

announce:
  interval_in_seconds: 0.05
  send_attempts: 3
  max_concurrent_sends: 1

qr:
  box_size: 10
  border: 2

widget:
  leaderboard_top_size: 5
  player_name_max_length: 12

howto:
  config_filename: shiro-vpn.conf

games:
  first_prizes:
    - {score: 0, days: 2, is_first: true}
    - {score: 0, days: 1, is_first: true}
    - {score: 0, discount_percent: 5, is_first: true}
    - {score: 0, discount_percent: 5, is_first: true}
  catalog:
    - id: packet
      title: Пакет
      min_seconds: 0.8
      unit: стен
      rewards:
        - {score: 10, is_first: true}
        - {score: 40, discount_percent: 15}
        - {score: 150, days: 14}
    - id: catch
      title: Ловец ключей
      min_seconds: 0.45
      unit: ключей
      rewards:
        - {score: 15, is_first: true}
        - {score: 70, discount_percent: 15}
        - {score: 220, days: 14}
    - id: ping
      title: Пинг
      min_seconds: 0.35
      unit: очков
      rewards:
        - {score: 20, is_first: true}
        - {score: 70, discount_percent: 15}
        - {score: 170, days: 14}
    - id: memory
      title: Память
      min_seconds: 2.0
      unit: раундов
      rewards:
        - {score: 5, is_first: true}
        - {score: 11, discount_percent: 15}
        - {score: 20, days: 14}

logging:
  file: bot.log
  max_bytes: 10000000
  backup_count: 2
  file_level: DEBUG
  stdout_level: INFO

unknown_message_ttl_in_seconds: 10

links:
  support: https://t.me/ShiroVPNsupp_bot
  privacy: https://telegra.ph/POLITIKA-KONFIDENCIALNOSTI-PO-RABOTE-S-PERSONALNYMI-DANNYMI-POLZOVATELEJ-09-29-2
  agreement: https://telegra.ph/Polzovatelskoe-soglashenie-04-01-19
  amnezia_download_url: https://amnezia.org/ru/downloads
  invite_share_url: https://t.me/share/url

texts:
  no_account: |-
    <b>Добро пожаловать в Shiro VPN</b> 🏯

    Быстрый VPN прямо из Telegram:
    ⚡️ без ограничений скорости и трафика
    🛡 протоколы VLESS и AmneziaWG — устойчивы к блокировкам
    📱 iPhone, Android, Windows и Mac
    🎁 бесплатный пробный период

    Создайте аккаунт — это займёт секунду.
  account_created: |-
    ✅ <b>Аккаунт создан!</b>

    Вам доступен <b>бесплатный пробный период</b> 🎁
