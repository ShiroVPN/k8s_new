    📲 Подключение в приложениях Happ, Incy или AmneziaVPN.

    <blockquote>💳 Оплата с баланса — пополняете и выбираете тариф.
    ⏳ При продлении оставшиеся дни не сгорают.
    💬 Поддержка отвечает прямо в Telegram.</blockquote>
  api_error: |-
    ⚠️ <b>Что-то пошло не так</b>

    Ошибка на нашей стороне. Попробуйте ещё раз через минуту или напишите в поддержку — поможем.
